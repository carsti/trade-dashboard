name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm --clean MT5-Bot-Dashboard.spec
      - name: Smoke test (Demo-Modus startet und antwortet)
        shell: pwsh
        run: |
          $p = Start-Process dist\MT5-Bot-Dashboard.exe -ArgumentList "--demo","--no-browser" -PassThru
          Start-Sleep 8
          $r = Invoke-WebRequest http://127.0.0.1:8765/ping -UseBasicParsing
          Stop-Process $p.Id
          if ($r.Content -ne "mt5-bot-dashboard") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MT5-Bot-Dashboard
          path: dist/MT5-Bot-Dashboard.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MT5-Bot-Dashboard.exe
