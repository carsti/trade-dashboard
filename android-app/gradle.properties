# -Djava.version strips the 5th version component that Azul Zulu / MS JDK
# can report (e.g. "27.0.1.0.3"), which Kotlin DSL's JavaVersion.parse()
# cannot handle. Setting it here overrides the property at daemon startup
# before Kotlin DSL reads it.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.version=27.0.1
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
